<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Home</title>
    <link rel="stylesheet" href="css/pokemon.css">
</head>
<body>

    <div class="pokemon-container">

        <img src="assets/pokemon-titulo.png" alt="Logo Pokémon" class="logo">

        <div class="pokemon-slot">
            <img id="gifPokemon" src="" alt="">

            <div id="coracaoClique" class="coracao-animado">❤️</div>
        </div>
    </div>

    <div id="cardTreinador" class="card-treinador">
        <div class="card-avatar">
            <img id="avatarTreinador" src="" alt="Avatar do Treinador">
        </div>
        <div class="card-infos">
            <h3 id="cardNome">Nome</h3>
            <p><strong>Nickname:</strong> <span id="cardNickname"></span></p>
            <p><strong>Idade:</strong> <span id="cardIdade"></span></p>
            <p><strong>Nascimento:</strong> <span id="cardNascimento"></span></p>
            <p><strong>Sexo:</strong> <span id="cardSexo"></span></p>
            <p><strong>Favoritos:</strong> <span id="cardFavoritos"></span></p>
            <p><strong>Pokémon:</strong> <span id="cardPokemon"></span></p>
        </div>
    </div>

</body>
</html>

  <script>
        document.addEventListener("DOMContentLoaded", () => {
            const pokemonSalvo = localStorage.getItem("pokemonEscolhido");
            const imgElement = document.getElementById("gifPokemon");

            if (pokemonSalvo) {
                imgElement.src = `assets/gifs/${pokemonSalvo}.gif`;
                imgElement.alt = pokemonSalvo;
            }
        });
        
    const pokemonGif = document.getElementById("gifPokemon");
    const coracao = document.getElementById("coracaoClique");

    pokemonGif.addEventListener("click", () => {

        coracao.classList.add("mostrar");

        setTimeout(() => {
            coracao.classList.remove("mostrar");
        }, 1000);
    });

    const dadosUsuarioString = localStorage.getItem("usuarioLogado");

    if (dadosUsuarioString) {
        const usuario = JSON.parse(dadosUsuarioString);

        
        document.getElementById("cardNome").textContent = usuario.nome || "Treinador";
        document.getElementById("cardNickname").textContent = usuario.nickname || "-";
        document.getElementById("cardIdade").textContent = usuario.idade || "-";
        document.getElementById("cardNascimento").textContent = usuario.dataNascimento || "-";
        document.getElementById("cardSexo").textContent = usuario.sexo || "-";
        document.getElementById("cardFavoritos").textContent = usuario.tiposFavoritos || "-";
        document.getElementById("cardPokemon").textContent = usuario.pokemonInicial || "-";

      
        const avatarImg = document.getElementById("avatarTreinador");
        const sexo = usuario.sexo ? usuario.sexo.toLowerCase() : "";

        if (sexo === "feminino" || sexo === "f") {
            avatarImg.src = "assets/icone-Mulher.png"; 
        } else if (sexo === "masculino" || sexo === "m") {
            avatarImg.src = "assets/icone-Homem.png"; 
        } else {
            avatarImg.src = "assets/icone-Outro.png"; 
        }
    }

    </script>
