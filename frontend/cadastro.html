<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon - Cadastro</title>

    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

    <main class="pagina">

        <section class="login">

            <img
                src="assets/Pokemon-Cadastro.jpg"
                class="fundo"
                alt=""
            >

        
            <div class="forma-superior"></div>
            <div class="forma-inferior"></div>

            <div class="conteudo">

                <img
                    src="assets/pokemon-titulo.png"
                    class="logo"
                    alt="Pokémon"
                >

                <form id="formCadastro">

                    <div class="campo">
                        <span>♙</span>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="NOME"
                            required
                        >
                    </div>

                    <div class="campo">
                        <span>♙</span>

                        <input
                            type="text"
                            id="nickname"
                            name="nickname"
                            placeholder="NICKNAME"
                            required
                        >
                    </div>

                    <div class="campo">
                        <span>✉</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="E-MAIL"
                            required
                        >
                    </div>


                    <div class="campo">
                        

                        <input
                            type="number"
                            id="idade"
                            name="idade"
                            placeholder="IDADE"
                            min="1"
                            max="120"
                            required
                        >
                    </div>


                    <div class="campo">

                        <input
                            type="date"
                            id="dataNascimento"
                            name="dataNascimento"
                            required
                        >
                    </div>


                    <div class="grupo-opcoes">

                        <p>SEXO:</p>

                        <label>
                            <input
                                type="radio"
                                name="sexo"
                                value="Masculino"
                                required
                            >
                            Masculino
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="sexo"
                                value="Feminino"
                            >
                            Feminino
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="sexo"
                                value="Outro"
                            >
                            Outro
                        </label>

                    </div>

                    <div class="grupo-opcoes">

                        <p>TIPOS DE POKÉMON FAVORITOS:</p>

                        <label>
                            <input
                                type="checkbox"
                                name="tipo"
                                value="Planta"
                            >
                            Planta
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="tipo"
                                value="Fogo"
                            >
                            Fogo
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="tipo"
                                value="Água"
                            >
                            Água
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="tipo"
                                value="Elétrico"
                            >
                            Elétrico
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="tipo"
                                value="Inseto"
                            >
                            Inseto
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="tipo"
                                value="Normal"
                            >
                            Normal
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="tipo"
                                value="Fantasma"
                            >
                            Fantasma
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="tipo"
                                value="Psíquico"
                            >
                            Psíquico
                        </label>

                    </div>


                    <div class="campo select-campo">

                        <select
                            id="pokemon"
                            name="pokemon"
                            required
                        >

                            <option value="">
                                SELECIONE SEU POKÉMON
                            </option>

                        </select>

                    </div>

                    <div class="campo">

                    

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="SENHA"
                            required
                        >

                    </div>



                    <button type="submit">
                        INICIAR JORNADA
                    </button>

                </form>

                <p class="cadastro">

                    Já possui conta?

                    <a href="login.html">
                        Faça Login
                    </a>

                </p>

            </div>

        </section>

    </main>

    <script src="/frontend/src/cadastro.js"></script>

</body>

</html>
